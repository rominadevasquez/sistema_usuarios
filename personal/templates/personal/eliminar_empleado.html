<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar empleado</title>
</head>
<body>

    <h1>Eliminar empleado</h1>

    <p>
        ¿Está seguro de que desea eliminar al empleado
        <strong>
            {{ empleado.nombre }} {{ empleado.apellido }}
        </strong>?
    </p>

    <p>
        Esta acción no se puede deshacer.
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

    </form>

    <p>
        <a href="{% url 'lista_empleados' %}">
            Cancelar
        </a>
    </p>

</body>
</html>
