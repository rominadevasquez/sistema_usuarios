<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar empleado</title>
</head>
<body>

    <h1>Registrar empleado</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar empleado
        </button>

    </form>

    <p>
        <a href="{% url 'lista_empleados' %}">
            Volver
        </a>
    </p>

</body>
</html>
