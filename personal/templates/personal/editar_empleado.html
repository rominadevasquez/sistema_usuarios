{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar empleado</title>

    <link rel="stylesheet"
          href="{% static 'personal/estilos.css' %}">
</head>

<body>

<div class="contenedor">

    <h1>Modificar empleado</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="boton"
                type="submit">
            Guardar cambios
        </button>

    </form>

    <div class="acciones">

        <a href="{% url 'lista_empleados' %}">
            Cancelar y volver
        </a>

    </div>

</div>

</body>
</html>
