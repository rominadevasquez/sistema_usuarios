<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>

    <h1>Crear una cuenta</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Registrarse
        </button>
    </form>

    <hr>

    <p>
        ¿Ya tienes una cuenta?
        <a href="{% url 'login' %}">
            Iniciar sesión
        </a>
    </p>

</body>
</html>
