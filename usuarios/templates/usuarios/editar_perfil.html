{% extends "base.html" %}

{% block title %}Editar perfil — Sistema Usuarios{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Editar perfil</h3>
                    <form method="POST" novalidate>
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a class="btn btn-link" href="{% url 'bienvenida' %}">Volver</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
