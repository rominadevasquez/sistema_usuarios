<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema Usuarios{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-" crossorigin="anonymous">
    <style>
      body { padding-top: 70px; }
      .form-error { color: #dc3545; }
      /* Make basic Django form markup look better without extra packages */
      form input, form select, form textarea {
        width: 100%;
        max-width: 100%;
        padding: .5rem .75rem;
        margin-bottom: .5rem;
        border: 1px solid #ced4da;
        border-radius: .25rem;
        box-sizing: border-box;
      }
      form label { font-weight: 600; }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
      <div class="container">
        <a class="navbar-brand" href="/">Sistema Usuarios</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/usuarios/login/">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="/usuarios/registro/">Registro</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      {% if messages %}
        <div class="mt-2">
          {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
